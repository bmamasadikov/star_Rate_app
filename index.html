<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b2e59">
<title>Joylashtirish vositalarini toifalash — 958:2026 / MSt 125</title>
<link rel="stylesheet" href="css/app.css?v=202609141914">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <span class="stars">★★★★★</span>
    <div style="min-width:0">
      <div class="title" data-ui="appTitle">Joylashtirish vositalarini toifalash</div>
      <div class="sub" data-ui="appSub"></div>
    </div>
  </div>
  <span class="savestate" id="saveState"></span>
  <div class="userbox hidden" id="userBox"><span class="uname" id="userName"></span><span class="badge gold" id="userRole"></span><button class="btn sm ghost" id="btnSignOut" style="color:#fff" data-ui="signOut"></button></div>
  <div class="lang-switch" id="langSwitch">
    <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </div>
</header>

<nav class="tabs" id="mainTabs">
  <button data-page="list" class="active" data-ui="navList">Baholashlar</button>
  <button data-page="assess" data-ui="navAssess">Baholash</button>
  <button data-page="registry" class="hidden" id="tabRegistry" data-ui="navRegistry">Reyestr</button>
  <button data-page="users" class="hidden" id="tabUsers" data-ui="navUsers">Foydalanuvchilar</button>
  <button data-page="standards" data-ui="navStandards">Standartlar</button>
</nav>

<main class="main">

  <!-- ============ Assessments list ============ -->
  <section class="page active" id="page-list">
    <div class="row between" style="margin-bottom:12px">
      <h1 data-ui="navList" style="margin:0">Baholashlar</h1>
      <div class="row">
        <label class="btn"><span>📥</span> <span data-ui="importJson">JSON import</span><input type="file" accept="application/json,.json" id="importFile" hidden></label>
        <button class="btn primary" id="btnNew958"><span>＋</span> <span data-ui="new958"></span></button>
        <button class="btn gold" id="btnNew125"><span>＋</span> <span data-ui="new125"></span></button>
      </div>
    </div>
    <div class="grid cols-2" style="margin-bottom:14px">
      <div class="card tight" style="margin:0"><b data-ui="new958"></b><div class="small muted" data-ui="new958D"></div></div>
      <div class="card tight" style="margin:0"><b data-ui="new125"></b><div class="small muted" data-ui="new125D"></div></div>
    </div>
    <div id="assessList"></div>
    <p class="small muted" data-ui="versionNote" style="margin-top:16px"></p>
  </section>

  <!-- ============ Assessment ============ -->
  <section class="page" id="page-assess">
    <div class="stepper" id="stepper">
      <button data-step="1"><span class="n">1</span><span class="txt"><span class="t" data-ui="step1"></span><span class="p" data-ui="step1p"></span></span></button>
      <button data-step="2"><span class="n">2</span><span class="txt"><span class="t" data-ui="step2"></span><span class="p" data-ui="step2p"></span></span></button>
      <button data-step="3"><span class="n">3</span><span class="txt"><span class="t" data-ui="step3"></span><span class="p" data-ui="step3p"></span></span></button>
      <button data-step="4"><span class="n">4</span><span class="txt"><span class="t" data-ui="step4"></span><span class="p" data-ui="step4p"></span></span></button>
    </div>

    <!-- Step 1: facility -->
    <div class="step" id="step-1">
      <div class="card">
        <div class="card-title"><h2 data-ui="facilityInfo"></h2></div>
        <div class="grid cols-2">
          <div class="form-group" style="grid-column:1/-1"><label class="field" data-ui="assessType"></label><select id="assessTypeSelect"></select><div class="hint" id="assessTypeHint"></div></div>
          <div class="form-group"><label class="field" data-ui="fName"></label><input type="text" data-f="name" autocomplete="organization"></div>
          <div class="form-group"><label class="field" data-ui="fRegion"></label><input type="text" data-f="region"></div>
          <div class="form-group" style="grid-column:1/-1"><label class="field" data-ui="fAddress"></label><input type="text" data-f="address"></div>
          <div class="form-group"><label class="field" data-ui="fKind"></label><select data-f="kind" id="kindSelect"></select><div class="hint" data-ui="kindNote"></div></div>
          <div class="form-group"><label class="field" data-ui="fGroup"></label><input type="text" id="groupDisplay" readonly class="input" style="background:var(--gray-50)"><div class="hint" id="clsDisplay"></div></div>
          <div class="form-group"><label class="field" data-ui="fRooms"></label><input type="number" min="0" inputmode="numeric" data-f="rooms"></div>
          <div class="form-group"><label class="field" data-ui="fBeds"></label><input type="number" min="0" inputmode="numeric" data-f="beds"></div>
          <div class="form-group"><label class="field" data-ui="fFloors"></label><input type="number" min="0" inputmode="numeric" data-f="floors"></div>
          <div class="form-group"><label class="field" data-ui="fDate"></label><input type="date" data-f="date"></div>
          <div class="form-group"><label class="field" data-ui="fContact"></label><input type="text" data-f="contact" autocomplete="name"></div>
          <div class="form-group"><label class="field" data-ui="fPhone"></label><input type="tel" data-f="phone" autocomplete="tel"></div>
          <div class="form-group"><label class="field" data-ui="fEmail"></label><input type="email" data-f="email" autocomplete="email"></div>
          <div class="form-group"><label class="field" data-ui="fInspector"></label><input type="text" data-f="inspector"></div>
        </div>
        <div class="form-group" id="targetGroup">
          <label class="field" data-ui="fTarget"></label>
          <div class="star-picker" id="starPicker"></div>
          <div class="hint" id="noPointsNote"></div>
        </div>
        <div class="form-group">
          <label class="field" data-ui="fFlags"></label>
          <div class="grid cols-2" id="flagGrid"></div>
        </div>
        <div class="row between">
          <span></span>
          <button class="btn primary" id="btnStep1Next"><span data-ui="continueBtn"></span> →</button>
        </div>
      </div>
    </div>

    <!-- Step 2: 958 checklist -->
    <div class="step hidden" id="step-2">
      <div class="toolbar"><div class="card tight">
        <div class="row between" style="margin-bottom:8px">
          <div><strong data-ui="checklistTitle"></strong> <span class="small muted" id="annexLabel"></span></div>
          <div class="small mono" id="progress958Text"></div>
        </div>
        <div class="progress" style="margin-bottom:8px"><span id="progress958Bar" style="width:0%"></span></div>
        <div class="row">
          <input type="search" class="input" style="flex:1;min-width:160px;min-height:36px;padding:6px 10px" id="search958" data-ph="search">
          <button class="chip" data-filter958="unanswered" data-ui="onlyUnanswered"></button>
          <button class="chip" data-filter958="no" data-ui="onlyNo"></button>
          <button class="chip" id="expand958" data-ui="expandAll"></button>
        </div>
      </div></div>
      <div id="list958"></div>
      <div class="row between" style="margin-top:12px">
        <button class="btn" data-goto="1">← <span data-ui="backBtn"></span></button>
        <button class="btn primary" data-goto="3"><span data-ui="continueBtn"></span> →</button>
      </div>
    </div>

    <!-- Step 3: 125 points -->
    <div class="step hidden" id="step-3">
      <div class="toolbar"><div class="card tight">
        <div class="row between" style="margin-bottom:8px">
          <div><strong data-ui="pointsTitle"></strong> <span class="small muted" id="groupLabel125"></span></div>
          <div class="small mono" id="progress125Text"></div>
        </div>
        <div class="progress" style="margin-bottom:8px"><span id="progress125Bar" style="width:0%"></span></div>
        <div class="row">
          <div class="seg mode" id="mode125"><button data-mode="mandatory"></button><button data-mode="optional"></button><button data-mode="all"></button></div>
          <label class="small" style="display:flex;align-items:center;gap:6px"><span data-ui="changeTarget"></span><select id="target125" style="width:auto;min-height:36px;padding:4px 8px"></select></label>
          <input type="search" class="input" style="flex:1;min-width:140px;min-height:36px;padding:6px 10px" id="search125" data-ph="search">
          <button class="chip" data-filter125="unanswered" data-ui="onlyUnanswered"></button>
          <button class="chip" id="expand125" data-ui="expandAll"></button>
        </div>
      </div></div>
      <div id="noPoints125" class="card hidden"><p data-ui="noPoints" style="margin:0"></p></div>
      <div id="list125"></div>
      <div class="row between" style="margin-top:12px">
        <button class="btn" data-goto="2">← <span data-ui="backBtn"></span></button>
        <button class="btn primary" data-goto="4"><span data-ui="step4"></span> →</button>
      </div>
    </div>

    <!-- Step 4: result & report -->
    <div class="step hidden" id="step-4">
      <div id="resultView"></div>
      <div class="card">
        <div class="card-title"><h2 data-ui="reportOptions"></h2></div>
        <div class="stack">
          <label class="check"><input type="checkbox" id="optFull" checked><span><span class="lbl" data-ui="optFull"></span></span></label>
          <label class="check"><input type="checkbox" id="optNotes" checked><span><span class="lbl" data-ui="optNotes"></span></span></label>
          <label class="check"><input type="checkbox" id="optPhotos" checked><span><span class="lbl" data-ui="optPhotos"></span></span></label>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="btnReport">📄 <span data-ui="buildReport"></span></button>
          <button class="btn gold" id="btnPrint">🖨️ <span data-ui="printPdf"></span></button>
          <button class="btn" id="btnExcel">📊 <span data-ui="exportExcel"></span></button>
          <button class="btn" id="btnJson">💾 <span data-ui="exportJson"></span></button>
          <button class="btn" id="btnShare">🔗 <span data-ui="share"></span></button>
        </div>
      </div>
      <div class="row between" style="margin-top:12px">
        <button class="btn" data-goto="3">← <span data-ui="backBtn"></span></button>
        <button class="btn danger" id="btnReset"><span data-ui="resetAnswers"></span></button>
      </div>
    </div>
  </section>

  <!-- ============ Registry (admin) ============ -->
  <section class="page" id="page-registry">
    <div class="row between" style="margin-bottom:12px">
      <div><h1 data-ui="registryTitle" style="margin:0"></h1><div class="small muted" data-ui="registryHint"></div></div>
      <div class="row"><button class="btn" id="btnRegistryRefresh">⟳ <span data-ui="refresh"></span></button><button class="btn" id="btnRegistryExcel">📊 <span data-ui="exportRegistry"></span></button></div>
    </div>
    <div class="card tight"><div class="row">
      <input type="search" class="input" style="flex:1;min-width:160px;min-height:36px;padding:6px 10px" id="registrySearch" data-ph="search">
      <select id="registryStatus" style="width:auto;min-height:36px;padding:6px 10px"></select>
      <select id="registryInspector" style="width:auto;min-height:36px;padding:6px 10px"></select>
    </div></div>
    <div id="registryList"></div>
  </section>

  <!-- ============ Users (admin) ============ -->
  <section class="page" id="page-users">
    <h1 data-ui="usersTitle"></h1>
    <div id="usersList"></div>
  </section>

  <!-- ============ Standards reference ============ -->
  <section class="page" id="page-standards">
    <div id="standardsView"></div>
  </section>

</main>

<!-- Report (printed area) -->
<div id="reportView">
  <div class="report-main">
    <div class="report-screen-actions">
      <button class="btn" id="btnCloseReport">← <span data-ui="closeReport"></span></button>
      <button class="btn gold" id="btnPrint2">🖨️ <span data-ui="printPdf"></span></button>
      <button class="btn" id="btnExcel2">📊 <span data-ui="exportExcel"></span></button>
    </div>
    <div class="report-wrap"><div class="report" id="reportBody"></div></div>
  </div>
</div>

<!-- Auth (cloud mode only) -->
<div class="auth hidden" id="authView">
  <div class="auth-card">
    <div class="auth-brand"><span class="stars">★★★★★</span><div class="title" data-ui="appTitle"></div><div class="small muted" data-ui="appSub"></div></div>
    <form id="authForm" autocomplete="on">
      <div class="form-group hidden" id="authNameGroup"><label class="field" data-ui="fullName" for="authName"></label><input type="text" id="authName" autocomplete="name"></div>
      <div class="form-group"><label class="field" data-ui="email" for="authEmail"></label><input type="email" id="authEmail" autocomplete="username" required></div>
      <div class="form-group"><label class="field" data-ui="password" for="authPassword"></label><input type="password" id="authPassword" autocomplete="current-password" required minlength="6"></div>
      <button class="btn primary block" type="submit" id="authSubmit" data-ui="signIn"></button>
    </form>
    <div class="row between" style="margin-top:12px">
      <button class="btn ghost sm" id="authToggle" data-ui="noAccount"></button>
      <button class="btn ghost sm" id="authForgot" data-ui="forgot"></button>
    </div>
    <div class="auth-pending hidden" id="authPending"><h3 data-ui="pendingTitle"></h3><p class="small muted" data-ui="pendingText"></p><button class="btn sm" id="authPendingOut" data-ui="signOut"></button></div>
    <div class="lang-switch auth-lang" id="authLang"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  </div>
</div>

<footer class="footer"><span data-ui="footer"></span></footer>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="js/data_958.js?v=202609141914"></script>
<script src="js/data_125.js?v=202609141914"></script>
